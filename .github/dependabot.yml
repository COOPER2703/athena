version: 2
# Une seule PR par groupe et par semaine : moins de bruit, et un seul run CI
# à valider par écosystème.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Versions épinglées dans pyproject.toml et couplées au code généré par
      # `make generate` : un bump casse
      # test_generated_header_version_matches_runtime (cf. PR #86). Le bump se
      # fait à la main : pyproject + `make generate` + revue du diff généré.
      # `applies-to: version-updates` laisse passer les security updates.
      - dependency-name: "protobuf"
        applies-to: version-updates
      - dependency-name: "grpcio-tools"
        applies-to: version-updates

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      web-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
