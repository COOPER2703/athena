[project]
name = "athena"
version = "0.1.0"
description = "Athena shared protocol — frozen Protobuf schema + generation chain"
requires-python = ">=3.12"
dependencies = [
    "protobuf==7.35.1",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.84.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocol"]
exclude = ["protocol/tests"]
