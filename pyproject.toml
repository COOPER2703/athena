[project]
name = "athena"
version = "0.1.0"
description = "Athena shared protocol — frozen Protobuf schema + generation chain"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.12.1",
    "protobuf==7.35.1",
    "websockets>=15.0",
    "pyaudio>=0.2.14",
    "pydantic>=2.14",
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
    "numpy>=2.0",
    "aiohttp>=3.14.5",
    "mcp>=2.3.0,<3",
    "httpx2>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.84.0",
    "pytest==9.1.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocol", "plugin_api", "server", "client"]
exclude = ["protocol/tests", "server/tests", "client/tests"]
