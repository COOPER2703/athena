[project]
name = "athena"
version = "0.1.0"
description = "Athena shared protocol — frozen Protobuf schema + generation chain"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.12.1",
    "protobuf==7.35.1",
    "websockets>=15.0",
    "pyaudio>=0.2.14",
    "pydantic>=2.14",
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
    "numpy>=2.0",
    "aiohttp>=3.14",
    "argon2-cffi>=25.1.0",
    "mcp>=2.3.0,<3",
    "httpx2>=2.16.0",
    # openWakeWord 0.6.0 (PyPI) tire tflite-runtime, sans wheel cp312. La
    # branche main utilise ai-edge-litert et speexdsp-ns, disponibles en 3.12.
    # À remplacer par une release dès que le correctif cp312 est publié.
    "openwakeword @ git+https://github.com/dscripka/openWakeWord.git@368c03716d1e92591906a84949bc477f3a834455",
    "onnxruntime>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.84.0",
    "pytest==9.1.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# openWakeWord est épinglé par URL Git (pas de wheel cp312 sur PyPI).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["protocol", "plugin_api", "server", "client"]
exclude = ["protocol/tests", "server/tests", "client/tests"]
# `packages` embarque déjà les data files versionnés ; ces motifs rendent
# l'intention explicite et gardent les modèles de la Veille dans le wheel,
# y compris si un `.gitignore` local les masque.
include = [
    "client/models/*.onnx",
    "client/models/*.json",
    "client/models/*.md",
    "client/models/*.txt",
]
artifacts = [
    "client/models/*.onnx",
    "client/models/*.json",
    "client/models/*.md",
    "client/models/*.txt",
]
